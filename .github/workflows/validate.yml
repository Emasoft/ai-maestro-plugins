name: Marketplace Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate marketplace structure
        run: |
          MARKETPLACE_JSON=".claude-plugin/marketplace.json"
          if [ ! -f "$MARKETPLACE_JSON" ]; then
            echo "FAIL: marketplace.json not found"
            exit 1
          fi
          python3 -c "import json; json.load(open('$MARKETPLACE_JSON'))" || { echo "FAIL: Invalid JSON"; exit 1; }
          echo "OK: marketplace.json is valid JSON"

          python3 -c "
          import json, sys
          with open('$MARKETPLACE_JSON') as f:
              data = json.load(f)
          if not data.get('name'):
              print('FAIL: missing marketplace name')
              sys.exit(1)
          plugins = data.get('plugins', [])
          if not plugins:
              print('FAIL: no plugins defined')
              sys.exit(1)
          for p in plugins:
              name = p.get('name', '?')
              if not p.get('name'):
                  print('FAIL: plugin entry missing name')
                  sys.exit(1)
              source = p.get('source')
              if not source:
                  print(f'FAIL: plugin {name} missing source')
                  sys.exit(1)
              if isinstance(source, dict):
                  src_type = source.get('source')
                  repo = source.get('repo', '')
                  if src_type == 'github' and repo:
                      print(f'OK {name}: GitHub -> {repo}')
                  else:
                      print(f'FAIL: plugin {name} invalid source')
                      sys.exit(1)
              else:
                  print(f'FAIL: plugin {name} source must be dict with source+repo')
                  sys.exit(1)
          print(f'')
          print(f'All {len(plugins)} plugin entries validated')
          "
