name: Update plugin version

on:
  repository_dispatch:
    types: [plugin-updated]
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin name to refresh (leave blank for all)
        required: false

permissions:
  contents: write

# Serialize concurrent dispatches so two plugins updating at once do not
# fight over marketplace.json.
concurrency:
  group: update-plugin-version
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout marketplace
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.MARKETPLACE_PAT }}
          fetch-depth: 1
          # Do not write the PAT into .git/config for the rest of the job;
          # the push step authenticates explicitly instead.
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Resolve target plugin
        id: target
        env:
          PLUGIN_FROM_DISPATCH: ${{ github.event.client_payload.plugin }}
          VERSION_FROM_DISPATCH: ${{ github.event.client_payload.version }}
          PLUGIN_FROM_MANUAL: ${{ inputs.plugin }}
        run: |
          set -euo pipefail
          PLUGIN="${PLUGIN_FROM_DISPATCH:-$PLUGIN_FROM_MANUAL}"
          VERSION="${VERSION_FROM_DISPATCH:-}"
          if [[ -z "$PLUGIN" ]]; then
            echo "No plugin name in payload; aborting." >&2
            exit 1
          fi
          echo "plugin=$PLUGIN"   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch version from plugin repo if missing
        id: fetch
        if: steps.target.outputs.version == ''
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_PAT }}
          PLUGIN: ${{ steps.target.outputs.plugin }}
        run: |
          set -euo pipefail
          # Find the plugin entry to get owner/repo from repository field
          OWNER_REPO=$(python3 - <<'PY'
          import json, os, re
          data = json.load(open('.claude-plugin/marketplace.json'))
          plugin = os.environ['PLUGIN']
          for p in data.get('plugins', []):
              if p.get('name') == plugin:
                  repo = p.get('repository', '')
                  # Extract owner/repo from https://github.com/owner/repo
                  m = re.match(r'https://github\.com/(.+)', repo)
                  if m:
                      print(m.group(1))
                  break
          PY
          )
          if [[ -z "$OWNER_REPO" ]]; then
            echo "Plugin $PLUGIN repository not found; nothing to do."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(gh api "repos/$OWNER_REPO/contents/.claude-plugin/plugin.json" --jq '.content' \
            | base64 -d \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('version',''))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update marketplace.json
        env:
          PLUGIN: ${{ steps.target.outputs.plugin }}
          VERSION: ${{ steps.target.outputs.version || steps.fetch.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$VERSION" ]]; then
            echo "No version resolved; skipping."
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          path = '.claude-plugin/marketplace.json'
          data = json.load(open(path))
          plugin  = os.environ['PLUGIN']
          version = os.environ['VERSION']
          for p in data.get('plugins', []):
              if p.get('name') == plugin:
                  old = p.get('version', '')
                  if old != version:
                      p['version'] = version
                      print(f'updated {plugin}: {old} -> {version}')
                  else:
                      print(f'{plugin} already at {version}')
                  break
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY

      # Runs BEFORE the change-check below, and its output is staged in the same
      # commit. Order is load-bearing: rendering after the check would leave the
      # README one commit behind forever, and a README-only diff (the manifest
      # already correct, the table stale) would never be committed at all.
      - name: Regenerate README plugin table
        id: versions
        # SKIPPED on ONE case only: `plugins` is present, IS a list, and is EMPTY.
        # This job runs UNATTENDED, so an accidentally emptied manifest would
        # otherwise have its table blanked AND COMMITTED here — and the --check gate
        # in validate-readme-table.yml would then PASS, because README and manifest
        # agree. The gate would arrive after the damage it exists to catch. Leaving
        # the rows in place makes --check go RED instead, so a human investigates.
        #
        # The discrimination is exactly the renderer's own: a MISSING `plugins` key
        # and a NON-LIST `plugins` both "count zero" under any naive count, so a
        # count-based skip would silently swallow the two structural failures the
        # renderer refuses loudly. Those fall through and redden the job.
        #
        # It is a `python -c` predicate inside an `if`, not `jq -e`: the default
        # shell here is `bash -e`, and a bare `jq -e` exits 1 on a false result,
        # which would abort the step on the NORMAL populated path.
        run: |
          if python3 -c 'import json, sys; d = json.load(open(".claude-plugin/marketplace.json", encoding="utf-8")); p = d.get("plugins") if isinstance(d, dict) else None; sys.exit(0 if isinstance(p, list) and not p else 1)' 2>/dev/null; then
            echo "manifest_empty=true" >> "$GITHUB_OUTPUT"
            echo "::warning::.claude-plugin/marketplace.json declares an EMPTY plugin list - SKIPPING the README table rewrite, and skipping the commit, so an accidental emptying cannot blank and commit the table. If this is intentional, run 'python3 scripts/render_readme_table.py' by hand and commit the result."
          else
            echo "manifest_empty=false" >> "$GITHUB_OUTPUT"
            python3 scripts/render_readme_table.py
          fi

      - name: Commit and push if changed
        # The other half of the empty-manifest guard: on that path the renderer was
        # skipped, so the commit is skipped with it. With no plugins in the manifest
        # the version-bump step above changed nothing either, so this skips a commit
        # that would have been either a no-op or the blanked table.
        if: steps.versions.outputs.manifest_empty != 'true'
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_PAT }}
          PLUGIN: ${{ steps.target.outputs.plugin }}
          VERSION: ${{ steps.target.outputs.version || steps.fetch.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .claude-plugin/marketplace.json README.md; then
            echo "No changes."
            exit 0
          fi
          # Checkout ran with persist-credentials: false, so origin has no
          # stored credential; authenticate this push explicitly. The PAT is
          # the repo owner's, so the push passes the branch ruleset via the
          # admin bypass while everyone else must go through a PR.
          PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add .claude-plugin/marketplace.json README.md
          git commit -m "chore: bump ${PLUGIN} to ${VERSION} [skip ci]"
          for attempt in 1 2 3; do
            if git push "$PUSH_URL" HEAD:main; then exit 0; fi
            git pull --rebase "$PUSH_URL" main
          done
          exit 1

      - name: Job summary
        if: always()
        env:
          PLUGIN: ${{ steps.target.outputs.plugin }}
          VERSION: ${{ steps.target.outputs.version || steps.fetch.outputs.version }}
        run: |
          {
            echo "## Plugin Version Update"
            echo ""
            echo "- Plugin: ${PLUGIN}"
            echo "- Version: ${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
